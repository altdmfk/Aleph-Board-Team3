{# 공통 헤더 — 데스크톱은 가로 메뉴, 모바일(lg 미만)은 햄버거 메뉴 #}
<header class="bg-white shadow-sm sticky top-0 z-20">
  <div class="max-w-5xl mx-auto px-4">
    <div class="flex justify-between items-center h-16">

      <div class="flex items-center gap-1">
        <!-- 로고 -->
        <a href="/" class="text-xl font-bold text-indigo-600 shrink-0 mr-2">📋 Aleph 게시판 실습</a>

        <!-- 데스크톱 메뉴 (md 이상에서만 보임) -->
        <nav class="hidden lg:flex items-center space-x-1">
          <a href="/" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition whitespace-nowrap">게시판</a>
          <a href="/dashboard" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition whitespace-nowrap">보안 대시보드</a>
          <a href="/#travel" class="px-3 py-2 rounded-lg text-sm font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100 transition whitespace-nowrap">부산 테마여행</a>
          <a href="/gold" class="px-3 py-2 rounded-lg text-sm font-medium text-amber-700 bg-amber-50 hover:bg-amber-100 transition whitespace-nowrap">🥇 골드 전용</a>
          <a href="/admin" class="px-3 py-2 rounded-lg text-sm font-medium text-red-700 bg-red-50 hover:bg-red-100 transition whitespace-nowrap">🔐 관리자</a>
        </nav>
      </div>

      <span id="auth-nav" class="hidden lg:flex items-center space-x-2 whitespace-nowrap"></span>

      <!-- 햄버거 버튼 (lg 미만에서만 보임) -->
      <button id="nav-toggle" type="button"
              class="lg:hidden inline-flex items-center justify-center p-2 rounded-lg text-gray-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-menu">
        <svg id="icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg id="icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- 모바일 드롭다운 메뉴 -->
    <nav id="mobile-menu" class="lg:hidden hidden pb-3 space-y-1 border-t border-gray-100 pt-2">
      <a href="/" class="block px-3 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100">게시판</a>
      <a href="/dashboard" class="block px-3 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100">보안 대시보드</a>
      <a href="/#travel" class="block px-3 py-2 rounded-lg text-sm font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100">부산 테마여행</a>
      <a href="/gold" class="block px-3 py-2 rounded-lg text-sm font-medium text-amber-700 bg-amber-50 hover:bg-amber-100">🥇 골드 전용</a>
      <a href="/admin" class="block px-3 py-2 rounded-lg text-sm font-medium text-red-700 bg-red-50 hover:bg-red-100">🔐 관리자</a>
      <span id="auth-nav-mobile" class="block px-3 py-2 space-x-2"></span>
    </nav>
  </div>
</header>

<script>
  // 햄버거 토글 — 아이콘 교체 + aria-expanded 갱신(접근성)
  (function () {
    const btn = document.getElementById('nav-toggle');
    const menu = document.getElementById('mobile-menu');
    const iconOpen = document.getElementById('icon-open');
    const iconClose = document.getElementById('icon-close');
    if (!btn || !menu) return;

    btn.addEventListener('click', function () {
      const willOpen = menu.classList.contains('hidden');
      menu.classList.toggle('hidden', !willOpen);
      iconOpen.classList.toggle('hidden', willOpen);
      iconClose.classList.toggle('hidden', !willOpen);
      btn.setAttribute('aria-expanded', String(willOpen));
      btn.setAttribute('aria-label', willOpen ? '메뉴 닫기' : '메뉴 열기');
    });

    // 데스크톱 폭으로 넓어지면 모바일 메뉴는 닫아 둔다
    window.addEventListener('resize', function () {
      if (window.innerWidth >= 1024 && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        iconOpen.classList.remove('hidden');
        iconClose.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // 로그인 상태 표시 — index.html 은 자체 updateAuthUI()로 나중에 덮어쓰지만,
  // gold.html/admin.html/dashboard.html 처럼 그 로직이 없는 페이지에서도 최소한 이름은 뜨게 한다.
  (function () {
    var navEl = document.getElementById('auth-nav');
    var navMobileEl = document.getElementById('auth-nav-mobile');
    if (!navEl) return;

    var _token = localStorage.getItem('token');
    var _username = localStorage.getItem('username');
    var html = (_token && _username)
      ? '<span class="text-sm font-medium text-gray-700">안녕하세요, <strong class="text-indigo-600">' + _username + '</strong>님</span>' +
        '<button id="_navAuthLogout" class="text-sm text-red-500 hover:underline">로그아웃</button>'
      : '<a href="/" class="text-sm text-indigo-600 font-medium hover:underline">로그인</a>';

    navEl.innerHTML = html;
    if (navMobileEl) navMobileEl.innerHTML = html;

    var logoutBtn = document.getElementById('_navAuthLogout');
    if (logoutBtn) logoutBtn.addEventListener('click', function () {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      location.href = '/';
    });
  })();
</script>
